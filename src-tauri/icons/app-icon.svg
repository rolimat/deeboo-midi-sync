<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c38"/>
      <stop offset="1" stop-color="#15161c"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#303035"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- vinyl disc with grooves -->
  <circle cx="512" cy="512" r="330" fill="url(#disc)"/>
  <g fill="none" stroke="#3b3c44" stroke-width="5">
    <circle cx="512" cy="512" r="300"/>
    <circle cx="512" cy="512" r="270"/>
    <circle cx="512" cy="512" r="240"/>
    <circle cx="512" cy="512" r="210"/>
  </g>
  <circle cx="512" cy="512" r="330" fill="url(#shine)"/>
  <!-- label: MIDI DIN connector, 5 pins on a 180° arc + key notch -->
  <circle cx="512" cy="512" r="165" fill="#ff7a3d"/>
  <g fill="#15161c">
    <circle cx="412" cy="512" r="22"/>
    <circle cx="612" cy="512" r="22"/>
    <circle cx="441" cy="441" r="22"/>
    <circle cx="583" cy="441" r="22"/>
    <circle cx="512" cy="412" r="22"/>
    <rect x="487" y="590" width="50" height="34" rx="8"/>
  </g>
  <!-- grip mark -->
  <path d="M512 182 v100" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <!-- "sending" dot -->
  <circle cx="790" cy="270" r="44" fill="#2fb36b" stroke="#15161c" stroke-width="12"/>
</svg>
