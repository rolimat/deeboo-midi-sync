name: macOS build
description: Toolchain, UI build and unsigned DMG, shared by CI and release.

runs:
  using: composite
  steps:
    - name: Install toolchain from rust-toolchain.toml
      shell: bash
      run: rustup show
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26"
    - run: npm ci --prefix ui
      shell: bash
    - run: npm --prefix ui run build
      shell: bash
    - run: npm --prefix ui run tauri build -- --bundles dmg
      shell: bash
